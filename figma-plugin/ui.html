<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px; color: var(--figma-color-text); background: var(--figma-color-bg); }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: var(--figma-color-text-secondary); }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--figma-color-border); border-radius: 6px; background: var(--figma-color-bg); color: inherit; font: inherit; }
  button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
  button.secondary { background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
  button:disabled { opacity: .5; cursor: default; }
  hr { border: 0; border-top: 1px solid var(--figma-color-border); margin: 16px 0 6px; }
  #log { margin-top: 10px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11px; max-height: 150px; overflow: auto; color: var(--figma-color-text-secondary); }
  .warn { color: var(--figma-color-text-warning); }
  .err { color: var(--figma-color-text-danger); font-weight: 600; }
</style>
</head>
<body>
<h1>Seoyoung Site Sync</h1>
<p>Edit text and images on the “Site · …” pages. Keep this window open and your edits go live by themselves about 20 seconds after you stop editing, or press Publish.</p>

<label for="site">Website address</label>
<input id="site" placeholder="https://le-beaver.github.io/seoyoungkong-art">

<button id="build" class="secondary">Rebuild Figma pages from the live site</button>
<p class="warn" style="margin-top:6px">Rebuilding replaces the “Site · …” pages with what is live now. Publish your edits first.</p>

<hr>
<label for="token">GitHub publish key</label>
<input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
<label for="repo">GitHub repository</label>
<input id="repo" placeholder="le-beaver/seoyoungkong-art">
<button id="publish">Publish my edits now</button>
<label style="font-weight:400;display:flex;gap:6px;align-items:center"><input id="auto" type="checkbox" checked style="width:auto"> Publish automatically while this window is open</label>

<div id="log"></div>

<script>
// Rich text <-> paragraph/run model shared by the Figma plugin (browser) and figma-sync (node).
// Model: [{ tag: 'h1'|'h2'|'h3'|'h4'|'p'|'pre', type: 'h1'..'h4'|'large'|'p'|'small', align, list, runs: [{ text, color, href, bold, italic }] }]
// color is a palette name ('accent', 'white', ...) or a #hex, or null for the theme default.
(function (root) {
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", apos: "'", nbsp: '\u00a0' };
  const decode = s => s.replace(/&(#x?[0-9a-f]+|[a-z]+|#39);/gi, (m, e) => {
    if (ENT[e.toLowerCase()] !== undefined) return ENT[e.toLowerCase()];
    if (e[0] === '#') return String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : +e.slice(1));
    return m;
  });
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escAttr = s => esc(s).replace(/"/g, '&quot;');
  const BLOCK = /^(h[1-6]|p|pre|li)$/;

  function htmlToParas(html) {
    const paras = [];
    const stack = []; // inline formatting stack
    let cur = null, listType = null;
    const start = (tag, attrs) => {
      const cls = (attrs.match(/class="([^"]*)"/) || [])[1] || '';
      const style = (attrs.match(/style="([^"]*)"/) || [])[1] || '';
      const align = (style.match(/text-align:\s*(left|center|right|justify)/) || [])[1] || null;
      let t = tag === 'li' ? 'p' : tag;
      if (/^h[5-6]$/.test(t)) t = 'h4';
      const type = /^h[1-4]$/.test(t) ? t : /sqsrte-large/.test(cls) ? 'large' : /sqsrte-small/.test(cls) ? 'small' : 'p';
      cur = { tag: t, type, align, list: tag === 'li' ? listType : null, runs: [] };
      paras.push(cur);
    };
    const fmt = () => {
      const f = { color: null, href: null, bold: false, italic: false };
      for (const s of stack) Object.assign(f, Object.fromEntries(Object.entries(s).filter(([, v]) => v)));
      return f;
    };
    const re = /<(\/?)([a-z0-9]+)([^>]*)>|([^<]+)/gi;
    let m;
    while ((m = re.exec(html))) {
      if (m[4] !== undefined) {
        const text = decode(m[4]);
        if (!text) continue;
        if (!cur) { if (!text.trim()) continue; start('p', ''); }
        cur.runs.push({ text, ...fmt() });
        continue;
      }
      const [, close, tagRaw, attrs] = m; const tag = tagRaw.toLowerCase();
      if (tag === 'ul' || tag === 'ol') { listType = close ? null : (tag === 'ul' ? 'UNORDERED' : 'ORDERED'); continue; }
      if (BLOCK.test(tag)) { if (close) { cur = null; } else start(tag, attrs); continue; }
      if (tag === 'br') { if (!cur) start('p', ''); cur.runs.push({ text: '\u2028', ...fmt() }); continue; }
      if (close) { stack.pop(); continue; }
      if (/\/$/.test(attrs)) continue;
      const cls = (attrs.match(/class="([^"]*)"/) || [])[1] || '';
      const st = (attrs.match(/style="([^"]*)"/) || [])[1] || '';
      const f = {};
      const cm = cls.match(/sqsrte-text-color--([A-Za-z]+)/); if (cm) f.color = cm[1];
      const sc = st.match(/(?:^|;)\s*color:\s*(#[0-9a-f]{3,8})/i); if (sc) f.color = sc[1].toUpperCase();
      if (tag === 'a') f.href = decode((attrs.match(/href="([^"]*)"/) || [])[1] || '');
      if (tag === 'strong' || tag === 'b') f.bold = true;
      if (tag === 'em' || tag === 'i') f.italic = true;
      stack.push(f);
    }
    for (const p of paras) {
      const merged = [];
      for (const r of p.runs) {
        const last = merged[merged.length - 1];
        if (last && last.color === r.color && last.href === r.href && last.bold === r.bold && last.italic === r.italic) last.text += r.text;
        else merged.push({ ...r });
      }
      p.runs = merged;
    }
    return paras;
  }

  function parasToHtml(paras) {
    let out = '', inList = null;
    for (const p of paras) {
      if (p.list !== inList) {
        if (inList) out += inList === 'ORDERED' ? '</ol>' : '</ul>';
        if (p.list) out += p.list === 'ORDERED' ? '<ol>' : '<ul>';
        inList = p.list;
      }
      const tag = p.list ? 'li' : p.tag;
      const cls = !/^h/.test(p.tag) && p.type === 'large' ? ' class="sqsrte-large"' : !/^h/.test(p.tag) && p.type === 'small' ? ' class="sqsrte-small"' : '';
      const style = p.align && p.align !== 'left' ? ` style="text-align: ${p.align}"` : '';
      let inner = '';
      for (const r of p.runs) {
        let t = esc(r.text).replace(/\u2028/g, '<br>');
        if (p.tag === 'pre') t = `<code>${t}</code>`;
        if (r.bold) t = `<strong>${t}</strong>`;
        if (r.italic) t = `<em>${t}</em>`;
        if (r.color) t = r.color[0] === '#' ? `<span style="color:${r.color}">${t}</span>` : `<span class="sqsrte-text-color--${r.color}">${t}</span>`;
        if (r.href) t = `<a href="${escAttr(r.href)}"${/^https?:/.test(r.href) ? ' target="_blank"' : ''}>${t}</a>`;
        inner += t;
      }
      out += `<${tag}${cls}${style}>${inner}</${tag}>`;
    }
    if (inList) out += inList === 'ORDERED' ? '</ol>' : '</ul>';
    return out;
  }

  const plain = paras => paras.map(p => p.runs.map(r => r.text).join('')).join('\n');
  const api = { htmlToParas, parasToHtml, plain, decode };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.RichText = api;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent = t + '\n' + $('log').textContent; };
const post = m => parent.postMessage({ pluginMessage: m }, '*');
let waiters = {};
onmessage = e => {
  const m = e.data.pluginMessage; if (!m) return;
  if (m.type === 'settings') {
    $('site').value = m.settings.site || 'https://le-beaver.github.io/seoyoungkong-art';
    $('repo').value = m.settings.repo || 'le-beaver/seoyoungkong-art';
    $('token').value = m.settings.token || '';
    $('auto').checked = m.settings.auto !== false;
  }
  if (m.type === 'edits-settled' && $('auto').checked) { if (busy) pendingAuto = true; else publish(true); }
  if (m.type === 'exported' && exportWaiter) { exportWaiter(m); exportWaiter = null; }
  if (m.type === 'page-done' && waiters[m.slug]) { waiters[m.slug](); delete waiters[m.slug]; }
  if (m.type === 'error') { log('Error: ' + m.message); if (m.slug !== undefined && waiters[m.slug]) { waiters[m.slug](); delete waiters[m.slug]; } }
};
post({ type: 'load-settings' });
const save = () => post({ type: 'save-settings', settings: { site: $('site').value.trim(), repo: $('repo').value.trim(), token: $('token').value.trim(), auto: $('auto').checked } });
['site', 'repo', 'token', 'auto'].forEach(id => $(id).addEventListener('change', save));
let busy = false, exportWaiter = null, pendingAuto = false;

async function toPng(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + url);
  const bmp = await createImageBitmap(await r.blob());
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

$('build').onclick = async () => {
  const site = $('site').value.trim().replace(/\/$/, '');
  save();
  $('build').disabled = true; busy = true;
  try {
    log('Reading ' + site + '/content.json …');
    const content = await (await fetch(site + '/content.json', { cache: 'no-store' })).json();
    post({ type: 'begin', theme: content.theme, siteUrl: site });
    const seed = String(Date.now());
    const pages = [...content.pages];
    if (content.footer) pages.push({ slug: '__footer', title: 'Footer (all pages)', sections: content.footer.sections, isFooter: true });
    for (let pi = 0; pi < pages.length; pi++) {
      const page = pages[pi];
      const images = {};
      for (const sec of page.sections) for (const b of sec.blocks) {
        if (b.type === 'text') b.paras = RichText.htmlToParas(b.html || '');
        const srcs = [];
        if (b.type === 'image' && b.src) srcs.push([b.src, b.src.endsWith('.webp') ? b.src.replace(/\.webp$/, '-800.webp') : b.src]);
        if (b.type === 'gallery') for (const it of b.items || []) if (it.src) srcs.push([it.src, it.src.replace(/\.webp$/, '-800.webp')]);
        if (b.video && b.video.kind === 'native') { const p = `/video/${b.video.id}/poster.webp`; srcs.push([p, p]); }
        for (const [key, file] of srcs) {
          if (images[key]) continue;
          try { images[key] = await toPng(site + file); } catch (e) { log('Image skipped: ' + file); }
        }
      }
      log(`Building “${page.title}” (${pi + 1}/${pages.length}) …`);
      await new Promise(res => { waiters[page.slug] = res; post({ type: 'page', page, images, site: { title: content.title, nav: content.nav }, seed, isFooter: !!page.isFooter, last: pi === pages.length - 1 }); });
    }
    log('Done. Edit away!');
  } catch (e) { log('Error: ' + e.message); }
  $('build').disabled = false; setTimeout(() => { busy = false; }, 25000);
};


// ---------- Publish: commit the Figma export to GitHub (one commit) ----------
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
async function gh(token, method, path, body) {
  const r = await fetch('https://api.github.com' + path, { method, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw Object.assign(new Error('expired'), { code: 401 });
  if (!r.ok) throw Object.assign(new Error(`GitHub ${r.status}: ${(await r.text()).slice(0, 160)}`), { code: r.status });
  return r.json();
}
async function publish(auto) {
  save();
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  if (!token) { if (!auto) log('Add your GitHub publish key first (see EDITING.md).'); return; }
  busy = true; $('publish').disabled = true;
  try {
    log(auto ? 'Edits settled — publishing…' : 'Publishing…');
    const { file, images } = await new Promise(res => { exportWaiter = res; post({ type: 'export' }); });
    for (let attempt = 0; attempt < 3; attempt++) {
      const ref = await gh(token, 'GET', `/repos/${repo}/git/ref/heads/main`);
      const head = await gh(token, 'GET', `/repos/${repo}/git/commits/${ref.object.sha}`);
      const tree = [];
      const exp = await gh(token, 'POST', `/repos/${repo}/git/blobs`, { content: JSON.stringify(file), encoding: 'utf-8' });
      tree.push({ path: 'figma-inbox/export.json', mode: '100644', type: 'blob', sha: exp.sha });
      for (const [hash, bytes] of Object.entries(images)) {
        const bl = await gh(token, 'POST', `/repos/${repo}/git/blobs`, { content: b64(new Uint8Array(bytes)), encoding: 'base64' });
        tree.push({ path: `figma-inbox/images/${hash}.png`, mode: '100644', type: 'blob', sha: bl.sha });
      }
      const t = await gh(token, 'POST', `/repos/${repo}/git/trees`, { base_tree: head.tree.sha, tree });
      const c = await gh(token, 'POST', `/repos/${repo}/git/commits`, { message: 'Figma: publish edits', tree: t.sha, parents: [ref.object.sha] });
      try { await gh(token, 'PATCH', `/repos/${repo}/git/refs/heads/main`, { sha: c.sha }); }
      catch (e) { if (e.code === 422 && attempt < 2) continue; throw e; }
      log(`Sent ✓ (${Object.keys(images).length} new image${Object.keys(images).length === 1 ? '' : 's'}). Live in about 2 minutes.`);
      if (!auto) post({ type: 'notify', text: 'Publishing — live in ~2 minutes' });
      break;
    }
  } catch (e) {
    if (e.code === 401) {
      $('log').innerHTML = '<span class="err">Your GitHub publish key has expired.</span> Make a new one (EDITING.md → “Renew the publish key”) and paste it above.\n' + $('log').innerHTML;
      post({ type: 'notify', text: 'GitHub publish key expired — paste a new one in the plugin', error: true });
    } else log('Error: ' + e.message);
  }
  busy = false; $('publish').disabled = false;
  // edits made while we were publishing go out in a follow-up publish
  if (pendingAuto) { pendingAuto = false; setTimeout(() => publish(true), 1000); }
}
$('publish').onclick = () => publish(false);
</script>
</body>
</html>
