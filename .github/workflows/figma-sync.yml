name: Sync from Figma

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-read Figma even if its version did not change
        default: "false"

concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: sync
        run: node scripts/figma-sync.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
          SYNC_SUMMARY: ${{ runner.temp }}/summary.md
      - name: Commit
        run: |
          git config user.name "figma-sync[bot]"
          git config user.email "figma-sync@users.noreply.github.com"
          git add content public/media
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            git commit -q -F "${{ runner.temp }}/summary.md"
          else
            git commit -q -m "chore(figma): record Figma version"
          fi
          git push
          cat "${{ runner.temp }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
